version: "0.1.0"

# Synthetic Berka-shaped banking sphere for the hypertopos-mcp test suite.
# Every row is produced by generate.py from a fixed seed; no real dataset
# rows are involved. The line / pattern / temporal layout mirrors the
# benchmark Berka sphere so the same MCP tool paths are exercised.

sphere_id: berka_banking
name: "Synthetic Banking (Berka-shaped)"
description: "Synthetic Berka-shaped banking sphere for MCP tests. 121 accounts, ~28k transactions, 1993-1998."

sources:
  accounts:
    path: accounts.parquet
  transactions:
    path: transactions.parquet
  orders:
    path: orders.parquet
  districts:
    path: districts.parquet
  tx_types:
    path: tx_types.parquet
  operations_src:
    path: operations.parquet
  cpty_banks_src:
    path: cpty_banks.parquet
  loan_accounts_src:
    path: loan_accounts.parquet

lines:
  transactions:
    source: transactions
    key: primary_key
    role: event
    description: "Individual banking transactions (deposits, withdrawals, transfers)."
  accounts:
    source: accounts
    key: primary_key
    role: anchor
    fts: true
    description: "Bank accounts enriched with owner demographics, loan status, card type, and standing orders."
  districts:
    source: districts
    key: primary_key
    role: anchor
    fts: true
    description: "Districts with region, population, and average salary."
  tx_types:
    source: tx_types
    key: primary_key
    role: anchor
    fts: true
    description: "Transaction types: PRIJEM (credit), VYDAJ (debit), VYBER (withdrawal)."
  operations:
    source: operations_src
    key: primary_key
    role: anchor
    fts: true
    description: "Transaction operation categories (VKLAD, PREVOD Z UCTU, VYBER, etc.)."
  cpty_banks:
    source: cpty_banks_src
    key: primary_key
    role: anchor
    fts: true
    description: "Counterparty bank codes for inter-bank transfers."
  orders:
    source: orders
    key: primary_key
    role: event
    description: "Standing orders (recurring payments)."
  accounts_stress:
    source: accounts
    key: primary_key
    role: anchor
    description: "Account stress view - separate entity line for the isolated stress pattern."
  loan_accounts:
    source: loan_accounts_src
    key: primary_key
    role: anchor
    description: "Loan-bearing accounts only. Isolated population for the loan stress pattern."

patterns:
  tx_pattern:
    type: event
    entity_line: transactions
    description: "Transaction geometry - account, type, operation, counterparty bank as relational dims + amount/balance as continuous event dims."
    relations:
      - line: accounts
        direction: in
        key_on_entity: account_id
        required: true
      - line: tx_types
        direction: in
        key_on_entity: type
        required: true
      - line: operations
        direction: in
        key_on_entity: operation
        required: false
      - line: cpty_banks
        direction: in
        key_on_entity: bank
        required: false
    event_dimensions:
      - column: amount
      - column: balance
    anomaly_percentile: 95
    dimension_weights: kurtosis

  account_behavior_pattern:
    type: anchor
    entity_line: accounts
    description: "Account behavioral profile - transaction activity, diversity, and burst patterns."
    derived_dimensions:
      - from_pattern: tx_pattern
        features:
          - tx_count: count
          - n_distinct_banks: count_distinct:bank
          - n_categories: count_distinct:k_symbol
          - n_operations: count_distinct:operation
          - burst_daily: "count:window=1d:agg=max"
          - burst_weekly: "count:window=7d:agg=max"
          - burst_monthly: "count:window=30d:agg=max"
      - from_pattern: orders
        features:
          - n_standing_orders_derived: count
    relations: auto
    anomaly_percentile: 95
    dimension_weights: kurtosis
    tracked_properties: [owner_gender, frequency]

  account_stress_pattern:
    type: anchor
    entity_line: accounts_stress
    description: "Financial stress signals - penalty interest, balance volatility, minimum balance, balance trend."
    precomputed_dimensions:
      - column: penalty_interest_count
        display_name: "Penalty Interest Count"
      - column: balance_volatility
        display_name: "Balance Volatility (CV)"
      - column: min_balance
        display_name: "Minimum Balance"
      - column: balance_trend
        display_name: "Balance Trend"
    derived_dimensions:
      - from_pattern: tx_pattern
        anchor_fk: account_id
        features:
          - amount_std: std:amount
          - mean_balance: avg:balance
    relations: []
    anomaly_percentile: 90
    group_by_property: frequency
    dimension_weights: kurtosis
    tracked_properties: [loan_status, has_loan]

  loan_stress_pattern:
    type: anchor
    entity_line: loan_accounts
    description: "Loan-only stress pattern - population restricted to loan-bearing accounts."
    precomputed_dimensions:
      - column: penalty_interest_count
        display_name: "Penalty Interest Count"
      - column: balance_volatility
        display_name: "Balance Volatility (CV)"
      - column: min_balance
        display_name: "Minimum Balance"
      - column: balance_trend
        display_name: "Balance Trend"
      - column: balance_to_loan
        display_name: "Balance-to-Loan Ratio"
      - column: income_coverage
        display_name: "Income Coverage Ratio"
    derived_dimensions:
      - from_pattern: tx_pattern
        anchor_fk: account_id
        features:
          - amount_std: std:amount
          - mean_balance: avg:balance
    relations: []
    anomaly_percentile: 90
    group_by_property: frequency
    dimension_weights: kurtosis
    tracked_properties: [loan_status]

aliases:
  high_activity_accounts:
    base_pattern: account_behavior_pattern
    cutting_plane:
      dimension: _d_tx_count
      threshold: 1.5
    description: "Accounts with tx_count > 1.5 sigma above mean - high-activity segment"
  low_engagement_accounts:
    base_pattern: account_behavior_pattern
    cutting_plane:
      dimension: _d_burst_monthly
      threshold: -1.0
    description: "Accounts with burst_monthly < -1 sigma - low engagement segment"

composite_lines:
  account_bank_pairs:
    event_line: transactions
    key_cols: [account_id, bank]
    description: "Account-bank relationship geometry."
    derived_dimensions:
      - features:
          - pair_tx_count: count
          - pair_sum_amount: sum:amount
          - pair_amount_std: std:amount
          - pair_category_diversity: count_distinct:k_symbol
    anomaly_percentile: 95

temporal:
  - pattern: account_behavior_pattern
    event_line: transactions
    timestamp_col: date
    window: 90d
  - pattern: account_stress_pattern
    event_line: transactions
    timestamp_col: date
    anchor_fk: account_id
    window: 90d
  - pattern: loan_stress_pattern
    event_line: transactions
    timestamp_col: date
    anchor_fk: account_id
    window: 90d
